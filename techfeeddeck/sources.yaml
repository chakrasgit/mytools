# TechFeedDeck sources
#
# Layout: an "independent" box first, then one box per company.
# Each box can have four groups (all optional, any order of entries):
#
#   accounts : official X accounts      -> just the handle, no @ and no URL
#   people   : individual X accounts    -> just the handle
#   links    : news, blogs, docs        -> name + url
#   youtube  : YouTube channels         -> name + url
#
# To add an X account, add one line, e.g.   - SomeHandle
# To add a link, add two lines:             - name: "Some Blog"
#                                             url: "https://example.com/blog"
# To add a company, copy any block under "companies" and edit it.
# Companies appear in the order listed here.

independent:
  accounts:
    - testingcatalog
  people:
    - VaibhavSisinty
  links:
    - name: "Reuters AI"
      url: "https://www.reuters.com/technology/artificial-intelligence/"
    - name: "AI Weekly"
      url: "https://aiweekly.co/"
  youtube:
    - name: "Vaibhav Sisinty"
      url: "https://www.youtube.com/@vaibhavsisinty"
    - name: "AI Search"
      url: "https://www.youtube.com/@theAIsearch"
    - name: "AI Revolution"
      url: "https://www.youtube.com/@airevolutionx"
    - name: "WorldofAI"
      url: "https://www.youtube.com/@intheworldofai"
    - name: "Code Digi"
      url: "https://www.youtube.com/@codedigiptbiplab"

